<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹珠消除游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(100, 200, 255, 0.3);
        }
        #gameCanvas {
            display: block;
            border-radius: 20px;
        }
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            z-index: 10;
        }
        #startScreen h1 {
            color: #00ff88;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        #startScreen p {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 1.2rem;
        }
        .difficulty-btn {
            padding: 15px 40px;
            margin: 10px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
        }
        .difficulty-btn.easy {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: white;
        }
        .difficulty-btn.normal {
            background: linear-gradient(135deg, #ffaa00, #ff8800);
            color: white;
        }
        .difficulty-btn.hard {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: white;
        }
        .difficulty-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }
        #gameUI {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
        }
        #scoreDisplay {
            font-size: 1.5rem;
            color: #00ff88;
        }
        #livesDisplay {
            font-size: 1.2rem;
            color: #ffaa00;
        }
        #timeDisplay {
            font-size: 1.2rem;
            color: #00aaff;
        }
        #levelDisplay {
            font-size: 1.2rem;
            color: #ff88ff;
        }
        #powerBar {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
        }
        #powerBarFill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00aaff);
            width: 50%;
            transition: width 0.1s ease;
        }
        #reclaimBtn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 30px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        #reclaimBtn:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            z-index: 10;
        }
        #gameOverScreen.show {
            display: flex;
        }
        #gameOverScreen h2 {
            color: #ff4444;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
        }
        #finalScore {
            color: #00ff88;
            font-size: 2rem;
            margin-bottom: 30px;
        }
        #restartBtn {
            padding: 15px 50px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        #restartBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }
        #winScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            z-index: 10;
        }
        #winScreen.show {
            display: flex;
        }
        #winScreen h2 {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="startScreen">
            <h1>弹珠消除</h1>
            <p>选择难度开始游戏</p>
            <button class="difficulty-btn easy" onclick="startGame('easy')">简单</button>
            <button class="difficulty-btn normal" onclick="startGame('normal')">普通</button>
            <button class="difficulty-btn hard" onclick="startGame('hard')">困难</button>
        </div>
        
        <div id="gameUI">
            <div id="levelDisplay">关卡: 1</div>
            <div id="scoreDisplay">分数: 0</div>
            <div id="livesDisplay">剩余发射: 10</div>
            <div id="timeDisplay">时间: 60s</div>
        </div>
        
        <div id="powerBar">
            <div id="powerBarFill"></div>
        </div>
        
        <button id="reclaimBtn" onclick="reclaimBall()">收回弹珠</button>
        
        <div id="gameOverScreen">
            <h2>游戏结束</h2>
            <div id="finalScore">最终分数: 0</div>
            <button id="restartBtn" onclick="restartGame()">重新开始</button>
        </div>
        
        <div id="winScreen">
            <h2>恭喜通关!</h2>
            <div id="finalScore">最终分数: 0</div>
            <button id="restartBtn" onclick="restartGame()">再玩一次</button>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
